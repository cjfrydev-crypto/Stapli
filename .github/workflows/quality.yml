name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke production Supabase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in {1..12}; do
            body="$(curl -fsS https://stapli-gray.vercel.app/api/health || true)"
            echo "Production health: $body"
            if [[ "$body" == *'"supabaseUrlConfigured":true'* && "$body" == *'"supabasePublishableKeyConfigured":true'* ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production is missing Stapli's required Supabase public configuration."
          exit 1
