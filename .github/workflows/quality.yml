name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke production Supabase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in {1..12}; do
            body="$(curl -fsS https://stapli-gray.vercel.app/api/health || true)"
            echo "Production health: $body"
            if [[ "$body" == *'"supabaseUrlConfigured":true'* && "$body" == *'"supabasePublishableKeyConfigured":true'* ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production is missing Stapli's required Supabase public configuration."
          exit 1
      - name: Smoke production MCP OAuth boundary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in {1..12}; do
            metadata="$(curl -fsS https://stapli-gray.vercel.app/.well-known/oauth-protected-resource/mcp || true)"
            status="$(curl -sS -o /tmp/mcp-body -w '%{http_code}' -X POST https://stapli-gray.vercel.app/mcp -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28"}}' || true)"
            echo "MCP metadata: $metadata"
            echo "Unauthenticated MCP status: $status"
            if [[ "$metadata" == *'"resource":"https://stapli-gray.vercel.app/mcp"'* && "$metadata" == *'dyacfwcpaahcubcwxrwh.supabase.co/auth/v1'* && "$status" == '401' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production MCP OAuth boundary is not ready."
          cat /tmp/mcp-body || true
          exit 1
